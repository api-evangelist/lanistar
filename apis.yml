x-domain-note: 'lanistar.com is still registered (GoDaddy, Cloudflare NS, expiry 2029-09-27) and
  still carries Google Workspace MX plus an SPF record, but the zone publishes no A, AAAA or
  CNAME record, so every HTTP probe fails at DNS resolution. lanistar.app and www.lanistar.app do
  not resolve. lanistar.co.uk resolves to a Spaceship.com domain-for-sale parking page and is not
  the company. lanistar.com.br is an unrelated Brazilian influencer-marketing site ("Lanislar
  Creator") and is deliberately not wired as a Website pointer.'
